<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Martín Coronado 3333</title>
<meta name="theme-color" content="#0a0c12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c12; --text: #eef0f6; --text-muted: #b7bad0;
    --accent: #7c6cf0; --accent-2: #4f8cff;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; color: var(--text); font-family: var(--font-body);
    position: relative; overflow-x: hidden;
    background-image:
      linear-gradient(180deg, rgba(10,12,18,0.25) 0%, rgba(10,12,18,0.6) 60%, #0a0c12 100%),
      linear-gradient(90deg, rgba(10,12,18,0.35), rgba(10,12,18,0.08)),
      url('/panel/edificio-hero.jpg');
    background-size: cover, cover, cover;
    background-position: center, center, center 35%;
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  @media (max-width: 640px) {
    body { background-attachment: scroll; }
  }
  .card {
    background: linear-gradient(165deg, rgba(23,27,44,0.78), rgba(14,16,24,0.82));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px; padding: 40px 32px; width: 100%; max-width: 420px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .logo { height: 52px; width: auto; margin-bottom: 20px; opacity: 0.95; }
  h1 {
    font: 700 21px/1.25 var(--font-display); margin: 0 0 10px; letter-spacing: 0.01em;
  }
  .sub {
    font: 400 13.5px/1.55 var(--font-body); color: var(--text-muted); margin: 0 0 30px;
    max-width: 32ch; margin-inline: auto;
  }
  .acciones { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; gap: 12px;
    min-height: 56px; border-radius: 12px; padding: 0 18px;
    text-decoration: none; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    text-align: left;
  }
  .btn:active { transform: scale(0.99); }
  .btn-icon {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon svg { width: 17px; height: 17px; }
  .btn-texto { display: flex; flex-direction: column; }
  .btn-titulo { font: 600 14.5px/1.3 var(--font-body); color: var(--text); }
  .btn-primary, .btn-secondary {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
  }
  .btn-primary:hover, .btn-secondary:hover { background: rgba(255,255,255,0.08); }
  .btn-primary .btn-icon, .btn-secondary .btn-icon { background: rgba(255,255,255,0.07); color: var(--text-muted); }
  .soporte {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
    font: 400 12px/1 var(--font-body); color: rgba(238,240,246,0.4);
    text-decoration: none; transition: color 0.15s;
  }
  .soporte:hover { color: rgba(238,240,246,0.7); }
  .soporte svg { width: 13px; height: 13px; flex-shrink: 0; }
  footer {
    position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    font: 400 11.5px/1 var(--font-body); color: rgba(238,240,246,0.45); letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/panel/logo-cr.png" class="logo" alt="CR — Barrio Parque">
    <h1>Martín Coronado 3333</h1>
    <p class="sub">Plataforma de comunicación del equipo de mantenimiento y conserjería.</p>
    <div class="acciones">
      <a class="btn btn-primary" href="/app/">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="btn-texto">
          <span class="btn-titulo">Ingresar como empleado</span>
        </div>
      </a>
      <a class="btn btn-secondary" href="/panel">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="btn-texto">
          <span class="btn-titulo">Panel de administración</span>
        </div>
      </a>
    </div>
    <a class="soporte" href="mailto:fichero.martincoronado@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      ¿Necesitás ayuda?
    </a>
  </div>
  <footer>Barrio Parque</footer>
</body>
</html>
